---
- name: Resolve requested OTel Collector version
  ansible.builtin.include_tasks: resolve_version.yml

- name: Check whether the installed executable exists
  ansible.builtin.stat:
    path: "{{ otel_agent_installation_dir }}/{{ otel_agent_executable }}"
    follow: true
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: otel_agent_executable_stat

- name: Set installed version to absent when the executable is missing
  ansible.builtin.set_fact:
    otel_agent_installed_version: "0.0.0"
  when: not otel_agent_executable_stat.stat.exists

- name: Discover installed version
  when: otel_agent_executable_stat.stat.exists
  block:
    - name: Get installed version
      ansible.builtin.command: '{{ otel_agent_installation_dir }}/{{ otel_agent_executable }} -v'
      register: otel_agent_version_check
      changed_when: false
      check_mode: false  # Always run, this does not change anything on the system

    - name: Parse installed version from command output
      ansible.builtin.set_fact:
        otel_agent_installed_version: "{{ otel_agent_version_check.stdout_lines[0] | default('') | ansible.builtin.regex_search('\\d+\\.\\d+\\.\\d+') }}"

    - name: Verify installed version was recognized
      ansible.builtin.assert:
        that:
          - "otel_agent_installed_version is string and otel_agent_installed_version is match('^\\d+\\.\\d+\\.\\d+$')"
        fail_msg: "Could not detect a three-part numeric version from the installed OpenTelemetry Collector output."

- name: Install the OTel Collector binary
  include_tasks: install.yml
  when: otel_agent_installed_version is version(otel_agent_resolved_version, '!=')

- name: Create OpenTelemetry Collector configuration directory
  ansible.builtin.file:
    path: "{{ otel_agent_config_dir }}"
    state: directory
    mode: '0755'
    owner: "root"
    group: "root"

- name: Deploy OpenTelemetry Collector configuration file
  ansible.builtin.template:
    src: otel_agent_config.yml.j2
    dest: "{{ otel_agent_config_dir }}/config.yml"
    owner: "root"
    group: "root"
    mode: '0640'
    validate: '{{ otel_agent_installation_dir }}/{{ otel_agent_executable }} --config=%s validate'
  register: otel_agent_config

- name: Copy OpenTelemetry Collector systemd unit file
  ansible.builtin.template:
    src: otel_agent.service.j2
    dest: /etc/systemd/system/{{ otel_agent_service_name }}.service
    mode: '0644'
  register: otel_agent_service_unit

- name: Reload systemd daemon to pick up changes
  ansible.builtin.systemd:
    daemon_reload: yes
  when: otel_agent_service_unit.changed

- name: Ensure OpenTelemetry Collector service is enabled and running
  ansible.builtin.service:
    name: "{{ otel_agent_service_name }}"
    enabled: yes
    state: "{{ 'restarted' if otel_agent_installed_version is version(otel_agent_resolved_version, '!=') or otel_agent_config.changed or otel_agent_service_unit.changed else 'started' }}"
  ignore_errors: '{{ ansible_check_mode | bool }}'
